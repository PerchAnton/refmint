name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 22, os: ubuntu-latest }
          - { node: 24, os: ubuntu-latest }
          - { node: 26, os: ubuntu-latest }
          - { node: 24, os: windows-latest }
          - { node: 24, os: macos-latest }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm example
      - run: pnpm test:demo
      - run: pnpm test:comparison
      - run: pnpm test:workflows
      - run: pnpm test:package
  workflow-pdf:
    name: PDF extraction and lookup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm test:workflows
      - run: python -m pip install -r examples/workflows/requirements-pdf.txt
      - run: python examples/workflows/pdf.py --check
  browsers:
    name: Chromium / Firefox / WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Match @playwright/test; browsers and OS dependencies are already installed.
    # Avoid downloading apt packages from the runner's mirror on every run.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --init --ipc=host
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pnpm for the container user
        run: |
          npm install -g --prefix "$RUNNER_TEMP/refmint-pnpm" pnpm@11.25.0
          echo "$RUNNER_TEMP/refmint-pnpm/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm test:browser
