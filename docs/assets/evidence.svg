<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">RefMint alpha: measured checks and reference lifecycle</title>
<desc id="desc">Zero runtime dependencies. The one-million-reference example uses 14 random characters and six checksum characters. All 4216 tested single-symbol substitutions were rejected. Tests do not establish a human error rate.</desc>
<rect width="1000" height="410" rx="20" fill="#102d27"/>
<g font-family="system-ui, sans-serif"><text x="36" y="45" fill="#9ee3bb" font-size="16" font-weight="700" letter-spacing="2">REFMINT / ALPHA EVIDENCE</text>
<text x="36" y="82" fill="#fff" font-size="27" font-weight="700">Make a reference. Catch a typo. Keep one storage key.</text>
<rect x="36" y="113" width="202" height="107" rx="12" fill="#204238"/><text x="54" y="160" fill="#b5f5ca" font-size="34" font-weight="700">0</text><text x="54" y="192" fill="#d3e4d8" font-size="14">runtime dependencies</text><rect x="278" y="113" width="202" height="107" rx="12" fill="#204238"/><text x="296" y="160" fill="#b5f5ca" font-size="34" font-weight="700">14 + 6</text><text x="296" y="192" fill="#d3e4d8" font-size="14">random + check symbols</text><rect x="520" y="113" width="202" height="107" rx="12" fill="#204238"/><text x="538" y="160" fill="#b5f5ca" font-size="34" font-weight="700">4,216</text><text x="538" y="192" fill="#d3e4d8" font-size="14">mutations rejected</text><rect x="762" y="113" width="202" height="107" rx="12" fill="#204238"/><text x="780" y="160" fill="#b5f5ca" font-size="34" font-weight="700">14.7 KiB</text><text x="780" y="192" fill="#d3e4d8" font-size="14">emitted JavaScript</text>
<rect x="36" y="250" width="202" height="49" rx="8" fill="#eff6ed"/><text x="137" y="280" text-anchor="middle" fill="#173c2c" font-size="15" font-weight="600">Generate</text><text x="249" y="282" fill="#9ee3bb" font-size="24">→</text><rect x="278" y="250" width="202" height="49" rx="8" fill="#eff6ed"/><text x="379" y="280" text-anchor="middle" fill="#173c2c" font-size="15" font-weight="600">Format for display</text><text x="491" y="282" fill="#9ee3bb" font-size="24">→</text><rect x="520" y="250" width="202" height="49" rx="8" fill="#eff6ed"/><text x="621" y="280" text-anchor="middle" fill="#173c2c" font-size="15" font-weight="600">Parse &amp; check</text><text x="733" y="282" fill="#9ee3bb" font-size="24">→</text><rect x="762" y="250" width="202" height="49" rx="8" fill="#eff6ed"/><text x="863" y="280" text-anchor="middle" fill="#173c2c" font-size="15" font-weight="600">Authorized lookup</text>
<text x="36" y="335" fill="#d3e4d8" font-size="14">14 random symbols: plan for 1 million codes with collision bound ≤ 10⁻⁹; default is 26.</text>
<text x="36" y="360" fill="#d3e4d8" font-size="14">4216 finite substitutions tested. No human-error-rate or speed advantage claimed.</text>
<text x="36" y="385" fill="#94b6a4" font-size="12">Reproduce: pnpm check &amp;&amp; pnpm evidence · 2026-10-27 · Source: docs/evidence.json</text></g></svg>
